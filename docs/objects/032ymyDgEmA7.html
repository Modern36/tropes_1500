<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>032ymyDgEmA7 — YOLO Object Detection Viewer</title>
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body data-page="objects">
  <nav class="page-nav"><a href="../index.html">DINO (Man/Woman)</a><a href="../objects.html" class="active">YOLO (Objects)</a></nav>
  <div class="image-page-nav">
    <a id="back-link" href="../objects.html">&#8592; Back to gallery</a>
    <button id="use-for-all">Use these settings for all images</button>
    <button id="download-image" class="btn-download"
            data-image-id="032ymyDgEmA7">Download image (.zip)</button>
  </div>
  <h1>032ymyDgEmA7</h1>
<div id="settings-panel">
  <div class="settings-row">
    <label>Threshold: <span id="threshold-val">0.25</span>
      <input type="range" id="threshold" min="0" max="1"
             step="0.05" value="0.25">
    </label>
    <label>Thickness: <span id="thickness-val">2</span>
      <input type="range" id="thickness" min="1" max="10"
             step="1" value="2">
    </label>
    <label>Font size: <span id="font_size-val">14</span>
      <input type="range" id="font_size" min="8" max="32"
             step="1" value="14">
    </label>
  </div>
  <div class="settings-row">
    <label>Vertical:
      <select id="text_v">
        <option value="top">top</option>
        <option value="center">center</option>
        <option value="bottom">bottom</option>
      </select>
    </label>
    <label>Horizontal:
      <select id="text_h">
        <option value="left">left</option>
        <option value="center">center</option>
        <option value="right">right</option>
      </select>
    </label>
    <label>Placement:
      <select id="text_place">
        <option value="outside">outside</option>
        <option value="inside">inside</option>
      </select>
    </label>
    <label>
      <input type="checkbox" id="fix_overlap">
      Fix overlapping labels
    </label>
  </div>
  <div class="settings-row" id="label-colors-row"></div>
</div>
  <div class="single-image-wrap"
       data-image-id="032ymyDgEmA7"
       data-width="1200"
       data-height="809"
       data-label-colors="{&quot;person&quot;: &quot;#FF0000&quot;, &quot;chair&quot;: &quot;#00FF00&quot;, &quot;dining table&quot;: &quot;#FF66B2&quot;, &quot;tie&quot;: &quot;#FF9933&quot;, &quot;laptop&quot;: &quot;#00FFFF&quot;}">
    <img src="../images_hires/032ymyDgEmA7.png"
         alt="032ymyDgEmA7"
         width="1200"
         height="809">
    <svg class="overlay"
         viewBox="0 0 1200 809"
         preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <h2>Detections</h2>
  <table id="detections-table">
    <thead>
      <tr>
        <th>Label</th><th>Score</th><th>Visible</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <script src="../app.js"></script>
</body>
</html>
